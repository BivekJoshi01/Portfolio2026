name: Deploy to cPanel

# Push to PRODUCTION goes live. `main` is the integration branch and does not
# deploy. Use the "Run workflow" button to redeploy by hand.
#
#   feature --PR--> ci.yml --merge--> main --merge--> PRODUCTION --> cPanel
#                                 (integration)      (release)
#
# The branch name is case-sensitive: PRODUCTION, not production.
#
# Same pipeline as InvestCareFront. This site shares that cPanel account, so it
# deploys to its own addon-domain folder (~/bivekjoshi03.com.np), never to
# public_html, which is investcare.com.np. Every file it puts in the home
# directory is prefixed portfolio- so it cannot collide with InvestCare's.

on:
  push:
    branches: [PRODUCTION]
  workflow_dispatch:

# Never let two deploys upload over each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Static site to bivekjoshi03.com.np
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Relative to the cPanel home directory. Must match the document root
      # chosen when the domain was added in cPanel.
      REMOTE_DIR: ${{ vars.SERVER_DEPLOY_PATH || 'bivekjoshi03.com.np' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Add the Apache config
        run: |
          cp deploy/site.htaccess dist/.htaccess
          cp deploy/assets.htaccess dist/assets/.htaccess

      # A silently-failed build must never be allowed to empty the live site.
      - name: Fail if the build looks empty
        run: |
          test -f dist/index.html         || { echo "dist/index.html missing";         exit 1; }
          test -f dist/.htaccess          || { echo "dist/.htaccess missing";          exit 1; }
          test -f dist/assets/.htaccess   || { echo "dist/assets/.htaccess missing";   exit 1; }
          ls dist/assets/index-*.js >/dev/null 2>&1 || { echo "dist/assets has no entry script"; exit 1; }

      # public_html is investcare.com.np. A wrong SERVER_DEPLOY_PATH would make
      # the sync step delete that site's files, so stop before connecting.
      - name: Refuse to target InvestCare's site
        run: |
          case "${REMOTE_DIR%/}" in
            ""|"."|"~"|public_html|public_html/*)
              echo "::error::SERVER_DEPLOY_PATH='$REMOTE_DIR' points at public_html or the home directory - that is investcare.com.np"
              exit 1
              ;;
          esac

      - name: Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the host key so the upload cannot be silently intercepted.
          for attempt in 1 2 3; do
            ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            test -s ~/.ssh/known_hosts && break
            sleep 15
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned nothing - check SERVER_HOST/SERVER_PORT"; exit 1; }

          # Every later ssh/scp rides ONE multiplexed connection, addressed as
          # `server`. cPanel's brute-force guard resets connections that arrive
          # in a burst ("kex_exchange_identification: Connection reset by
          # peer") — more likely now that three repositories deploy here.
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            Port ${SERVER_PORT:-22}
            User $SERVER_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 20m
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

          # Open the shared connection, backing off while the server is still
          # throttling this runner's address.
          for attempt in 1 2 3 4 5; do
            ssh -fN server && exit 0
            echo "::warning::SSH connection attempt $attempt was refused; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::Could not open an SSH connection after 5 attempts"
          exit 1

      # Prove the connection works before touching anything on the server.
      - name: Verify SSH access
        run: |
          ssh server \
              "test -d '$REMOTE_DIR' && echo 'remote dir OK' || { echo '~/$REMOTE_DIR does not exist - add the domain in cPanel first'; exit 1; }"

      # The host has no rsync, so the build ships as a tarball and
      # deploy/remote-sync.sh installs it, removing stale assets and refusing a
      # truncated upload. See that script for what it never touches.
      - name: Pack the build
        run: |
          tar czf portfolio-deploy.tgz -C dist .
          ls -lh portfolio-deploy.tgz

      - name: Upload to the document root
        run: |
          cp deploy/remote-sync.sh portfolio-sync.sh
          scp portfolio-deploy.tgz portfolio-sync.sh server:~/

          ssh server \
            "chmod +x ~/portfolio-sync.sh && ~/portfolio-sync.sh ~/portfolio-deploy.tgz ~/$REMOTE_DIR && rm -f ~/portfolio-sync.sh"

      # A live domain answering anything other than 200 fails the run. If it
      # answers 200 but without this build's entry script, DNS most likely
      # still points at the old host (Netlify), so that is only a warning.
      - name: Check the site responds
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bivekjoshi03.com.np' }}
        run: |
          host=$(printf '%s' "$SITE_URL" | sed -E 's,^https?://,,; s,/.*,,')

          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::warning::$host does not resolve yet - DNS is not pointed at the server."
            echo "The upload succeeded. Re-run this workflow once DNS propagates."
            exit 0
          fi

          code=$(curl -s -o page.html -w '%{http_code}' --max-time 30 "$SITE_URL/")
          echo "GET $SITE_URL/ -> $code"
          [ "$code" = "200" ] || { echo "::error::$SITE_URL returned $code, expected 200"; exit 1; }

          entry=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          if grep -qF "$entry" page.html; then
            echo "Live site is serving this build ($entry)."
          else
            echo "::warning::$SITE_URL is up but not serving this build ($entry). Is Cloudflare DNS pointed at the cPanel server yet?"
          fi

      - name: Close the connection and remove the key
        if: always()
        run: |
          ssh -O exit server 2>/dev/null || true
          rm -f ~/.ssh/deploy_key ~/.ssh/config
